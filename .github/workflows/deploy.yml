name: Deploy no GitHub Pages

on:
    push:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Instalar Node
              uses: actions/setup-node@v5
              with:
                  node-version: lts/*
                  cache: "npm"

            - name: Instalar dependências
              run: npm ci

            - name: Build
              run: npm run build

            - name: Configurar Pages
              uses: actions/configure-pages@v5

            - name: Enviar dist
              uses: actions/upload-pages-artifact@v4
              with:
                  path: "./dist"

            - name: Publicar
              id: deployment
              uses: actions/deploy-pages@v4
